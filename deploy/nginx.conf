# Template only: substitute domain and configure TLS certificates first.
# Keep Gunicorn bound to loopback. Overwrite all forwarding headers.
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=byte_api:10m rate=5r/s;
server {
    listen 80;
    server_name course.example.kz;
    return 301 https://course.example.kz$request_uri;
}
server {
    listen 443 ssl;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server_name course.example.kz;
    ssl_certificate /etc/letsencrypt/live/course.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/course.example.kz/privkey.pem;
    client_max_body_size 256k;
    client_body_timeout 15s;
    location / {
        limit_req zone=byte_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 125s;
        proxy_buffering off;
    }
}
