{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}Кабинет{% endblock %} — BYTE</title>
<script src="{% static 'js/theme.js' %}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261005-ai3">
<link rel="stylesheet" href="{% static 'css/theme.css' %}">
<link rel="stylesheet" href="{% static 'css/motion.css' %}?v=20261005-ai3">
</head>
<body class="app-body">
<header class="app-header"><div class="app-header-inner">
<a class="brand" href="{% url 'index' %}"><img src="{% static 'img/logo.jpg' %}" alt="BYTE">BYTE</a>
<nav class="app-tabs" aria-label="Разделы кабинета"><a class="app-tab{% if active_tab == 'materials' %} is-active{% endif %}" href="{% url 'dashboard' %}">Материалы</a><a class="app-tab{% if active_tab == 'analytics' %} is-active{% endif %}" href="{% url 'analytics' %}">Аналитика</a><a class="app-tab{% if active_tab == 'contest' %} is-active{% endif %}" href="{% url 'contest' %}">Лайв-контест</a></nav>
<div class="app-user"><span class="app-user-name">{{ user.get_username }}</span><button class="theme-button" id="themeButton" type="button" aria-label="Включить светлую тему">☀</button><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-ghost btn-sm" type="submit">Выйти</button></form></div>
</div></header>
{% block body %}{% endblock %}
{% block floating_ui %}{% endblock %}
{% block scripts %}{% endblock %}
<script src="{% static 'js/motion.js' %}"></script>
</body></html>
